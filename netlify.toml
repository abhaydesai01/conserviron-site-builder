## Netlify deployment config for this TanStack Start project.
## The project defaults to Cloudflare Workers (see vite.config.ts) so Lovable's
## Publish button keeps working. When Netlify builds this repo it overrides the
## nitro preset to `netlify`, which emits a Netlify Function for SSR plus the
## static assets under `dist/`.

[build]
  command = "bun run build"
  # Nitro's netlify preset writes static assets to `dist/` (publicDir =
  # `{{ rootDir }}/dist/{{ baseURL }}`), NOT `dist/client` (that layout is
  # only used by the cloudflare preset Lovable ships by default).
  publish = "dist"

[build.environment]
  # Force nitro (used internally by TanStack Start) to build a Netlify target.
  NITRO_PRESET = "netlify"
  # Match the runtime Netlify Functions uses.
  NODE_VERSION = "20"

# Nitro's netlify preset emits the SSR handler to
# `.netlify/functions-internal/server.mjs`, which Netlify auto-registers and
# serves at `/.netlify/functions/server`. The redirect below is generated by
# the preset at build time, but we declare it explicitly so `netlify deploy`
# from a fresh checkout still routes unmatched paths to the SSR function.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = false
